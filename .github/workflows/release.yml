name: Release

# Three ways to publish a release (the in-game updater downloads the asset
# matching its platform from the latest release):
#   * change the VERSION file and push (any branch) -> releases v<VERSION>
#   * push a tag such as v1.2.3
#   * run this workflow manually with a version number
# A version that already has a published release is skipped.
#
# Builds are attached straight to a draft release (no workflow artifacts, so
# the Actions artifact storage quota does not matter), and the draft is
# published only after every platform uploaded successfully.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["VERSION", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(tr -d ' \r\n' < VERSION)"; v="${v#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then echo "Bad version '$v'"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Create a draft release (skip if already published)
        id: check
        shell: bash
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = "false" ]; then
            echo "Release $tag is already published, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$state" = "true" ]; then
            gh release delete "$tag" --yes   # leftover draft from a failed run
          fi
          gh release create "$tag" --draft --target "${{ github.sha }}" \
            --title "Protect Me Knight PC $tag" --generate-notes
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test src/ProtectMeKnightPC.slnx -c Release

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/PMK.Launcher/PMK.Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -p:UpdateRepository=${{ github.repository }} \
            -p:PublishReadyToRun=true \
            -o out/${{ matrix.rid }}
          cp README.md out/${{ matrix.rid }}/README.md
          cp THIRD-PARTY-NOTICES.md out/${{ matrix.rid }}/THIRD-PARTY-NOTICES.md

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath ProtectMeKnightPC-${{ matrix.rid }}.zip

      - name: Zip (Linux)
        if: runner.os != 'Windows'
        run: cd out/${{ matrix.rid }} && chmod +x ProtectMeKnight && zip -qr ../../ProtectMeKnightPC-${{ matrix.rid }}.zip .

      - name: Attach to the draft release
        shell: bash
        run: gh release upload "v${{ needs.prepare.outputs.version }}" "ProtectMeKnightPC-${{ matrix.rid }}.zip" --clobber

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false --latest
