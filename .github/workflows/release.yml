name: Release

# Push a tag like v1.2.3 to build and publish a release. The in-game updater
# downloads the asset matching its platform from the latest release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test src/ProtectMeKnightPC.slnx -c Release

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/PMK.Launcher/PMK.Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:UpdateRepository=${{ github.repository }} \
            -p:PublishReadyToRun=true \
            -o out/${{ matrix.rid }}
          cp README.md out/${{ matrix.rid }}/README.md
          cp THIRD-PARTY-NOTICES.md out/${{ matrix.rid }}/THIRD-PARTY-NOTICES.md

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath ProtectMeKnightPC-${{ matrix.rid }}.zip

      - name: Zip (Linux)
        if: runner.os != 'Windows'
        run: cd out/${{ matrix.rid }} && chmod +x ProtectMeKnight && zip -qr ../../ProtectMeKnightPC-${{ matrix.rid }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ProtectMeKnightPC-${{ matrix.rid }}
          path: ProtectMeKnightPC-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Protect Me Knight PC ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
