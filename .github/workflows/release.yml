name: Release

# Three ways to publish a release (the in-game updater downloads the asset
# matching its platform from the latest release):
#   * change the VERSION file and push (any branch) -> releases v<VERSION>
#   * push a tag such as v1.2.3
#   * run this workflow manually with a version number
# A version that already has a release is skipped.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(tr -d ' \r\n' < VERSION)"; v="${v#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then echo "Bad version '$v'"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Skip versions that are already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/tags/v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.version }} already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test src/ProtectMeKnightPC.slnx -c Release

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/PMK.Launcher/PMK.Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -p:UpdateRepository=${{ github.repository }} \
            -p:PublishReadyToRun=true \
            -o out/${{ matrix.rid }}
          cp README.md out/${{ matrix.rid }}/README.md
          cp THIRD-PARTY-NOTICES.md out/${{ matrix.rid }}/THIRD-PARTY-NOTICES.md

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath ProtectMeKnightPC-${{ matrix.rid }}.zip

      - name: Zip (Linux)
        if: runner.os != 'Windows'
        run: cd out/${{ matrix.rid }} && chmod +x ProtectMeKnight && zip -qr ../../ProtectMeKnightPC-${{ matrix.rid }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ProtectMeKnightPC-${{ matrix.rid }}
          path: ProtectMeKnightPC-${{ matrix.rid }}.zip

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Protect Me Knight PC v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.zip
